services:
  - type: web
    name: twindrop-share
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWINDROP_LOG_LEVEL
        value: info
      - key: TWINDROP_FRONTEND_ORIGINS
        value: https://t.sendcore.uz,https://twindrop.pages.dev
      - key: TWINDROP_FRONTEND_URL
        value: https://t.sendcore.uz
